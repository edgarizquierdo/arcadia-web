<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Acceso privado · Atlas BioScan</title><link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/style.css"></head><body><div class="loginwrap"><div class="loginbox"><img class="loginlogo" src="../assets/arcadia-logo-selected.png" alt="Arcadia Global Analytics"><div class="kicker" style="color:#d9a764">Arcadia Global Analytics</div><h1>Atlas BioScan</h1><p>Área privada de demostración. Introduce la clave de acceso para continuar.</p><form id="gate"><input id="pass" type="password" autocomplete="current-password" placeholder="Contraseña" autofocus><button class="btn dark" type="submit">Acceder</button><div class="error" id="err"></div></form><p style="font-size:11px">Esta protección JavaScript es solo para la demo local. Para producción se incluye configuración de autenticación de servidor.</p></div></div><script>const H='43c9af3d16265f2859f397290ad04ee5a7a22d010d10934595ad0a410266eddf';async function dig(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}document.getElementById('gate').onsubmit=async e=>{e.preventDefault();if(await dig(document.getElementById('pass').value)===H){sessionStorage.setItem('atlas_access','1');location.href='index.html'}else document.getElementById('err').textContent='Contraseña incorrecta.'}</script></body></html>
